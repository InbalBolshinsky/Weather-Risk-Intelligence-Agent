# 20 illustrative distribution hubs (synthetic; see PLAN.md §1.4).
# lat/lon = metro center (not a real facility). Region = US Census Bureau region.
# station = main-airport NOAA GHCN-Daily station (verified 2026-11-25: 2016-2025 coverage
# 100% for PRCP/TMAX/TMIN; SNOW 100% except MIA 20%, PHX 21%, LAX 1% -> grid-model fallback).
# aliases: alternate names, airport names and IATA codes, matched before any geocoding.

hubs:
